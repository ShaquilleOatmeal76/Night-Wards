<body>

            {x:500, y:150}, 
            {x:300, y:150}, 
            {x:300, y:500}, 
            {x:800, y:500}
        ];

            ctx.strokeStyle = "red";
            ctx.lineWidth = 23;
            ctx.beginPath();
            for (let i = 0; i < path.length; i++) {

            ctx.stroke();
            ctx.fillStyle = "yellow"
