<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tower Defense</title>
</head>
<body>
    <canvas id="game" width="800" height="600"></canvas> 
    <script>
         const canvas = document.getElementById("game");
         const ctx = canvas.getContext("2d");

         ctx.fillStyle = "darkslategray"; 
         ctx.fillRect(0, 0, canvas.width, canvas.height);

         ctx.strokeStyle = "red";
         ctx.lineWidth = 23;
         ctx.beginPath();
         ctx.moveTo(0, 50);
         ctx.lineTo(100, 50);
         ctx.lineTo(100,350);
         ctx.lineTo(500,350);
         ctx.lineTo(500,150);
         ctx.lineTo(300,150);
         ctx.lineTo(300,500);
         ctx.lineTo(800,500);

         ctx.stroke();
    </script>   
</body>
</html>
